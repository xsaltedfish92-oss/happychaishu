.fab{position:fixed;bottom:max(24px,calc(24px + env(safe-area-inset-bottom)));right:20px;width:52px;height:52px;border-radius:50%;background:#222222;color:#FFFFFF;font-size:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,0.15);transition:transform .15s;z-index:10;line-height:1}

.tag-horizontal-box{display:flex;flex-direction:row;padding:10px 16px;gap:8px;background:#FFFFFF;border-bottom:1px solid #EFEFEF;overflow-x:auto;white-space:nowrap;flex-shrink:0}
.tag-horizontal-box::-webkit-scrollbar{display:none}
.tag-pill{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:20px;border:1px solid #EFEFEF;font-family:inherit;font-size:13px;white-space:nowrap;cursor:pointer;transition:all .12s;background:#FAFAFA;color:#333333}
.tag-pill.on{background:#E6F0FA !important;color:#0066CC !important;border-color:#B3D1F5 !important;font-weight:700}
.e-card{padding:14px 16px;border-bottom:1px solid #EFEFEF;background:#FFFFFF;cursor:pointer;transition:background .1s}
.e-card:active{background:#FAFAFA}

.e-scene-name{font-size:15px;color:#111111;font-weight:500}
.e-meta{font-size:12px;color:#999999;margin-top:6px}
.d-sec{padding:16px 16px;border-bottom:1px solid #EFEFEF;background:#FFFFFF}
.d-lbl{font-size:11px;color:#999999;letter-spacing:1px;margin-bottom:8px;font-weight:700}
.d-text{font-size:15px;color:#111111;line-height:1.7;white-space:pre-wrap}
.kw-chips{display:flex;flex-wrap:wrap;gap:6px}

.d-time{font-size:11px;color:#BBBBBB}
.f-sec{padding:12px 16px;border-bottom:1px solid #F5F5F5;background:#FFFFFF}
.f-lbl{font-size:12px;color:#666666;margin-bottom:6px;font-weight:700}
.inp{width:100%;max-width:500px;background:#FFFFFF;border:1px solid #CCCCCC;border-radius:6px;color:#333333;padding:8px 12px;font-size:14px;font-family:inherit;line-height:1.6;resize:vertical}
.inp:focus{outline:none;border-color:#0066CC}
.inp-single{resize:none}
.f-hint{font-size:11px;color:#999999;margin-top:4px}
.tag-sel-horizontal-scroll{display:flex;gap:6px;overflow-x:auto;white-space:nowrap;padding:2px 0}

.tag-sel-btn{display:inline-block;padding:6px 12px;border-radius:16px;border:1px solid #EFEFEF;font-family:inherit;font-size:13px;cursor:pointer;background:#FAFAFA;color:#333333;transition:all .1s}

.sm-btn{background:#FFFFFF;border:1px solid #CCCCCC;color:#555555;padding:6px 12px;border-radius:4px;font-family:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.sm-btn:active{background:#F5F5F5}
.sm-btn.danger{color:#FF3B30;border-color:#FF3B30}
.type-switch{display:flex;gap:8px;max-width:500px}
.type-btn{flex:1;padding:10px;border-radius:6px;border:1px solid #CCCCCC;font-family:inherit;font-size:13px;cursor:pointer;transition:all .12s;background:#FFFFFF;color:#555555;text-align:center}

::-webkit-scrollbar{width:4px}

// ─────────────────────────────────────────────────────────

const DEFAULT_TAGS = [
  {id:'tg_wm',label:'外貌'},

function newDB(){return{books:[],tags:[...DEFAULT_TAGS],entries:{}}}

// ③ save() 改为写入 Firebase，加防抖（500ms）避免频繁请求
let _saveTimer = null;
function save(){
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(()=>{
    cloudRef.set(db)
      .then(()=>showToast())
      .catch(e=>console.error('云端保存失败:',e));
  }, 500);
}

function showToast(){
  const t = document.getElementById('sync-toast');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2000);
}

function uid(){return '_'+Math.random().toString(36).slice(2,9)}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function fmtDate(ts){const d=new Date(ts);return`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function getEntries(chId){return db.entries[chId]||[]}

let db = newDB(); // 先用空数据，等云端加载完再替换

// ④ 从 Firebase 异步加载数据，完成后才显示主界面

const SEED_DATA = {"books": [{"chapters": [{"id": "_jgddvq6", "name": "1-5章"}], "id": "_ewfxh6a", "name": "二哈与大白猫"}, {"id": "_x12gwdx", "name": "桃花债"}], "entries": {"_jgddvq6": [{"id": "_f66i9zn", "keywords": "眉目俊美 面容骄奢 银蓝轻铠 狮首腰带（闪烁） 马尾高束 绾发扣", "notes": "简要概括配角，设定有（腰带，马尾，轻铠）", "sentence": "然而这时，一个眉目极其俊美，面容骄奢的青年走了出来。他穿着一袭银蓝轻铠，狮首腰带，马尾高束，底部绾着一只精致的银色发扣。\n殿内金砖之上，薛蒙孑然而立，马尾散落，轻铠闪烁。", "tagId": "tg_wm", "ts": 1779766734477, "type": "regular"}, {"id": "_mi6if7y", "keywords": "浑身赤裸 面目稚嫩 五官玲珑 玉雪可爱 羊脂白玉 雌雄莫辨 小白脸 露出截儿肩膀脖子 暧昧的痕迹", "notes": "", "sentence": "还是个浑身赤裸的男人！\n此男子面目稚嫩，五官玲珑，瞧上去玉雪可爱，雌雄莫辨。\n墨燃脸上毫无表情，内心却波涛汹涌，盯着那张沉浸在睡梦中的小白脸看了半天，突然想起来了。\n然而，这会儿他却活生生，白嫩嫩地窝在自己床侧，锦被里露出截儿肩膀脖子，青青紫紫的，全是暧昧的痕迹。\n一条羊脂白玉似的粉嫩大腿\n那美人慵懒地坐了起来，身上披着的薄薄锦被顺着肩膀滑下，露出大片晃眼的白皙身子，他笼着柔软长发，挑起一双犹带睡意的桃花眼，眼尾晕染着残红，打了个哈欠。", "tagId": "tg_wm", "ts": 1779766870039, "type": "regular"}, {"id": "_m04en4l", "keywords": "面目颇为稚气 俊俏眉目 飞扬跋扈 十五六岁", "notes": "", "sentence": "但此刻镜子里的那位哥们儿的面目却显得颇为稚气，俊俏眉目里透着一股少年人独有的飞扬跋扈，看起来，不过十五六岁的模样。", "tagId": "tg_wm", "ts": 1779766943525, "type": "regular"}, {"id": "_ybut7ie", "keywords": "盘靓条顺 眉梢眼角风情  风华绝代韵味", "notes": "形容人面容姣好、身材匀称的惯用表达.“盘儿”指面部轮廓，“亮”表示五官精致美观；“条儿”指体态身形，“顺”则强调比例协调、线条流畅。", "sentence": "薛丫越长越大，越长越俊，盘靓条顺的，眉梢眼角都是风情，颇有些风华绝代的韵味儿。", "tagId": "tg_wm", "ts": 1779767113825, "type": "regular"}, {"id": "_7vgshi4", "keywords": "新冢 阴冷潮湿（风） 万叶千声 厉鬼冤魂 唧唧私语 沙沙游走 凿着", "notes": "", "sentence": "阴冷潮湿的寒风夹杂着万叶千声，浓雾里就像无数厉鬼冤魂在山林间唧唧私语，沙沙游走。\n薛蒙孤身行至山顶，墨燃所在的雄伟宫殿在夜幕中亮着安宁的烛光。他忽然瞧见通天塔前，立着三座坟，走近一看，第一座坟头长着青草，墓碑上歪七扭八凿着“卿贞皇后楚姬之墓”八个狗爬大字。\n第二座坟，是一座新冢，封土才刚刚盖上，碑上凿着", "tagId": "tg_hj", "ts": 1779767214756, "type": "regular"}, {"id": "_00hxofi", "keywords": "城郊夏意浓 车马驰过", "notes": "", "sentence": "城郊夏意浓，偶有车马驰过，车轮滚滚，无人会去注意此时才年方十五岁的墨燃。\n　　只偶尔有田间忙碌的村妇，得了空抬头抹汗，瞧见个格外标致的少年，会眼前一亮，盯着看两眼。\n　　墨燃也笑嘻嘻地，毫不客气地看回去，直把那些有夫之妇看得满脸绯红，低下头来。", "tagId": "tg_hj", "ts": 1779767276510, "type": "regular"}, {"id": "_lvboc7z", "keywords": "红日如血 火烧云霞 巍峨峰峦 红底黑字", "notes": "", "sentence": "傍晚时分，墨燃来到无常镇，这里离死生之巅很近了，暮色里一轮红日如血，火烧云霞衬着巍峨峰峦。一摸肚子，有些饿了，他于是熟门熟路地进了家酒楼，瞅  "sentence": "墨燃则脸色骤变，一时间有些天旋地转，他摈住呼吸，难以置信地睁大了眼睛——这个声音……\n墨燃低喝着急奔上来，灌满灵力一掌打出，就将五个为非作歹的江湖道士统统震开！他跪坐在地上，扶起了满身泥灰脚印的黑斗篷，嗓音都忍不住微微发颤—", "tagId": "tg_dz", "ts": 1779768624056, "type": "regular"}, {"id": "_ayvrbls", "keywords": "痛骂 纷纷附和 面色沉凝 激越 立刻嘲讽道  脸色很难看，他说 周围人炸开了 和声和气劝道 竭力按捺 面目扭曲", "notes": "", "sentence": "关起房门来痛骂过、众将领纷纷附和、有人面色沉凝，说道，\n这番话说的激越了些\n立刻又有人嘲讽道\n青年的脸色很难看，他说\n他这么一说，周围一圈人就炸开了。\n连忙拦住待要发作的青年，换作一副乡绅面孔，和声和气地劝道\n气的面目扭曲，嘴唇颤抖，却还竭力按捺着，问道：\n陡然暴怒了：\n提起他的师尊，众人的脸色都有些挂不住。\n有人面露愧色，有人则左瞟右瞟，嗫嚅不语。\n最终有人干咳两声，柔声道：\n那人睁大眼睛：\n他再也说不下去了，喉头哽咽\n讲到最后，薛蒙猛地扭过了头，肩膀微微颤抖着，忍着眼泪\n有人轻声说了句，\n有些刻薄了，立刻有人喝止住：又转头和颜悦色地劝薛蒙\n薛蒙猛然打断了他的话头，目眦尽裂\n薛蒙挣开被老和尚拉住的衣角，哑声道", "tagId": "tg_xd", "ts": 1779768736673, "type": "regular"}, {"id": "_4oj3wn4", "keywords": "只沙哑说了句 心中不知何滋味 只问 轻轻哼了一声 说着微微一笑 一愣 旋即笑道 状似不经意问 厉声道", "notes": "", "sentence": "墨燃没有抬头，只沙哑地说了句\n心中不知是何滋味，欲言又止，最终仍是捏紧了拳，只问：“\n墨燃轻轻哼了一声，终于缓缓睁开了黑中透着些紫的眼眸，隔着层峦叠嶂的岁月，落在了薛蒙身上。\n墨燃说着，微微一笑。\n容九一愣，旋即笑道：\n墨燃整理好了情绪，状似不经意地问道\n薛蒙厉声道\n墨燃眼波暗涌，脑内飞速转着。", "tagId": "tg_xd", "ts": 1779768834612, "type": "regular"}, {"id": "_o4vede6", "keywords": "简直荒唐 磨磨叽叽 胆小怕事废物 凡夫俗子（乡野村夫） 天之骄子 讥讽嘲弄 废话少说 讲什么疯话 站着说话不腰疼 哭丧鬼 贱婢", "notes": "", "sentence": "简直荒唐\n磨磨唧唧的不肯上去，难道是想等墨微雨自己爬下来？真是群胆小怕事的废物！\n薛公子是天之骄子，我们只是凡夫俗子，既然天之骄子等不及了要去和人界帝尊争锋\n忍着这些人的讥讽和嘲弄\n所以啊，十年你都等过来了，也不急于这一时半刻，你说对不对？”\n“对？去你妈的对！”\n废话少说！把他还给我！”\n讲什么疯话！管好你的嘴！\n你们站着说话不腰痛\n吵什么吵！哪里来的哭丧鬼！来人，把这贱婢给我乱棍打下山去！”", "tagId": "tg_mr", "ts": 1779769059609, "type": "regular"}, {"id": "_67u5wmo", "keywords": "啐了一口 抿了抿嘴唇 展颜笑了 慢条斯理地喊了一声 兀自思考  瞬间暴怒 嘴里嚷着 挠着头喃喃 文文弱弱喊了句 善解人意地说 呛了几声", "notes": "", "sentence": "容九的脸一红，啐了一口\n墨燃抿了抿嘴唇，展颜笑了，在珠帘后面慢条斯理地喊了一声：\n这边正兀自思考着，那边那个黑斗篷低声和那几个道士说了几句什么话，那几个道士闻言，竟是瞬间暴怒，嘴里嚷着\n有人挠着头喃喃道\n死生之巅各个都是以一当十的凶悍勇猛，这黑斗篷打架却不厉害，眼见着都被那几个江湖道士拉下马，围在中间猛踹了，却还不下狠手。\n反而文文弱弱地喊了句\n尊主干脆大手一挥，善解人意地说：\n黑斗篷呛了几声，才缓过气儿来，抬眼去看墨燃", "tagId": "tg_xd", "ts": 1779769265718, "type": "regular"}, {"id": "_594jlnk", "keywords": "法力高深，为人阴毒", "notes": "", "sentence": "墨微雨法力高深，为人阴毒，我们还是谨慎为上，不要着了他的道。", "tagId": "tg_pj", "ts": 1779769343508, "type": "regular"}, {"id": "_tga3y 是活生生的人啊……", "tagId": "tg_xz", "ts": 1779770044993, "type": "regular"}, {"id": "_r4qr8ws", "keywords": "同门被打 门派氛围 派中掌门跟杂役 灌满灵力一掌打出 统统震开", "notes": "", "sentence": "眼见同门被打，墨燃却是低低笑了两声，“这么凶呀。”\n　　他丝毫没有出手相助的意思。前世，他就特讨厌本门这种路见不平拔刀相助的门派氛围，一个两个都跟傻子似的往上冲，村口王大妈的猫崽子爬树下不来了都要他们来帮忙，派中从掌门到杂役，各个缺心眼儿。\n\n灌满灵力一掌打出，就将五个为非作歹的江湖道士统统震开！", "tagId": "tg_xz", "ts": 1779770120280, "type": "regular"}, {"id": "_fh64sp3", "keywords": "盘 酒肆 窑子接客 小倌害了花柳病 尸骨朽没", "notes": "", "sentence": "青楼早在自己二十多岁时就盘了出去，后来改成了酒肆。\n被阎王罚去投胎到窑子接客\n特别宠爱的小倌\n这小倌后来害了花柳病，早就死掉好多年了，尸骨都该朽没了", "tagId": "tg_cs", "ts": 1779770218897, "type": "regular"}, {"id": "_5g55oif", "keywords": "酒楼 这当口打尖儿 说书先生在台子摇扇 临窗的包间 听讲书 窗下张望 支起摊子 耍把戏卖艺 满楼的人 酒楼上下", "notes": "", "sentence": "这当口打尖儿的人很多，热闹的紧，说书先生在台子上摇着扇子，正在讲死生之巅的故事，说的是眉飞色舞，唾沫横飞。\n墨燃要了个临窗的包间，边吃饭，边听人家讲书。\n这段历史，墨燃听着耳朵都快起茧子了，于是兴趣缺缺地便开始朝着窗下走神张望。正巧，楼下支了个摊子，几个道士打扮的外乡人运着个黑布蒙着的笼子，正在街头耍把戏卖艺。\n满楼的人嘎嘎笑开了，都聚到窗栏边去看下面的热闹。说书先生还在可怜巴巴地继续讲\n酒楼上下，众人乌泱泱地围将过去凑热闹", "tagId": "tg_cs", "ts": 1779770353655, "type": "regular"}, {"id": "_jdsbnx6", "keywords": "拐卖 没见识 江湖道士", "notes": "", "sentence": "这边村民没见识，在那边胡言乱语着，但墨燃却琢磨过来了。\n　　相传，有些江湖道士会去拐骗小孩，然后将孩子的舌头拔掉，让他们说不出话来，再拿滚水烫掉小孩的皮，趁着血肉模糊之际，把兽皮粘在他们身上，鲜血凝固之后，皮毛和小孩粘合在一起，看起来就和妖怪无异。这些孩子不会说话，不会写字，只能任由人欺凌，配合着表演“貔貅打算盘”这种杂耍，如果反抗，引来的就是一阵棍棒鞭打。", "tagId": "tg_cs", "ts": 1779770398191, "type": "regular"}, {"id": "_gz2pm8a", "keywords": "床 雕龙绘凤 脂粉气息 旧被褥粉红粉紫 纹饰", "notes": "", "sentence": "这张床雕龙绘凤，木头散发着沉甸甸的脂粉气息，铺上的旧被褥粉红粉紫，绣着鸳鸯戏水的纹饰，正是勾栏女人才会睡的枕被。", "tagId": "tg_wj", "ts": 1779770473158, "type": "regular"}, {"id": "_95ct9ky", "keywords": "铜镜 磨损", "notes": "", "sentence": "铜镜磨损的很厉害，但昏黄的光晕里，还是模糊可以瞧见他自己的容貌。", "tagId": "tg_wj", "ts": 1779770486549, "type": "regular"}, {"id": "_be0q3yv", "keywords": "脑壳儿 倒霉名字 全赖没学识 君子动口不动手 狗熊崽子 热闹劲儿 开眼了 牛可真吹破天了 谁信谁驴脑子", "notes": "", "sentence": "之所以取了这么个倒霉名字，全赖死生之巅的尊主没学识\n这是馒头瓤子的脑壳儿，没馅儿吧？\n这副奶奶样了，还君子动口不动手？这是馒头瓤子的脑壳儿，没馅儿吧？\n低眉顺眼毛茸茸的狗熊崽子\n这牛真可快吹破天了，谁信谁驴脑子。\n但墨燃没过多久就开眼了，二三十个驴脑子聚在他们周围看戏，时不时喝彩鼓掌，那个热闹劲儿，连酒楼里的人都忍不住探头出去看了，弄得说书先生好不尴尬。", "tagId": "tg_sy", "ts": 1779770770381, "type": "regular"}, {"id": "_gpdgbku", "keywords": "陈年私仇 不甘颓丧 凡此五味 死前种种 遣散了仆从 同仇敌忾 等等", "notes": "", "sentence": "报那么一点陈年私仇\n身前的种种不甘，颓丧，孤独，凡此五味，都还停在胸间\n\n临死前的种种犹如风吹雪散\n以传送术遣散了仆从歪七扭八凿着“卿贞皇后楚姬之墓”八个狗爬大字。\n站在权力巅峰\n名阀贵胄\n和稀泥的\n众矢之的\n不管不顾\n捱过了三年\n地方上开始蠢蠢欲动，无论是佛修、道修、还是灵修，那些无法忍受墨燃暴政的江湖义士们，都开始接二连三地发动争讨起义。\n惨不忍睹、惊天地泣鬼神的年号横空出世——“戟罢”。 绞尽脑汁想出来的两个字\n\n修真界的动荡终于全面爆发。忍气吞声了近十年的江湖义士、仙侠豪杰，终于合纵连横，组成了浩浩汤汤的百万大军，逼宫始皇墨微雨。\n\n数月浴血征伐后，义军终于来到死生之巅山脚下\n获胜曙光再望\n原本同仇敌忾地盟军内部开始各萌异心\n开膛破肚，撕咬成渣", "tagId": "tg_sy", "ts": 1779770849279, "type": "regular"}, {"id": "_trlug7k", "keywords": "", "notes": "", "sentence": "然而这时 丢下这番话", "tagId": "tg_zz", "ts": 1779770862654, "type": "regular"}, {"id": "_3vprhc2", "notes": "", "passage": "墨燃平静地望了他一眼，忍着胃部的阵阵抽痛，嘴角嘲讽，靠在帝座的椅背之上。\n眼前一阵阵发黑，他几乎觉得自己能清晰地感受到脏腑在扭曲，溶解，化成污臭的血水。\n墨燃慵懒道\n墨燃轻笑，墨燃淡淡地抬眼，墨燃倏忽笑了：（这个笑的反应是针对薛蒙提起晚宁的好）\n良久死寂。\n胃疼得像是烈火灼烧，血肉被撕成千万片碎末残渣。\n墨燃缓了口气，强作镇定。说这番话的时候，他面无表情，手指搁在紫檀长案上，指节却苍白泛青。\n喉间涌上一股腥甜，墨燃咳嗽几声，再开口时，唇齿之间尽是鲜血，但目光却是轻松自在。\n他嘶哑地说\n说完这句话后，他颓然合上双眸，毒剂攻心，烈火煎熬。\n疼痛是如此撕心裂肺，甚至薛蒙悲恸扭曲的嚎啕哀鸣也变得那样遥远，犹如隔着万丈汪洋，从水中传来。\n鲜血不住地从嘴角涌出，墨燃捏紧衣袖，肌肉阵阵痉挛。\n模糊地睁开眼睛\n墨燃撑起身子，摇摇晃晃地站起来，血迹斑驳的手指结了个法印，把自己传送到了死生之巅的通天塔前。", "sceneName": "墨燃服毒的变化", "ts": 1779770890987, "type": "scene"}, {"id": "_wl4z7re", "notes": "", "passage": "此时正是深秋，海棠花开的稠丽风流。\n　　他不知道自己为何最后会选择在这里结束罪恶的一生。但觉花开得如此灿烂，不失为芳冢。\n　　他躺进敞开的棺椁，仰面看着夜间繁花，无声飘谢。\n　　飘入棺中，飘于脸颊。纷纷扬扬，如往事凋零去。\n　　这一生，从一无所有的私生子，历经无数，成为人间界唯一的帝君尊主。\n　　他罪恶至极，满手鲜血，所爱所恨，所愿所憎，到最后，什么都不再剩下。\n　　他也终究，没有用他那信马由缰的字儿，给自己的墓碑上提一句话。不管是臭不要脸的“千古一帝”，还是荒谬如“油爆”“清蒸”，他什么都没写，修真界始皇的坟茔，终究片言不曾留。\n　　一场持续了十年之久的闹剧，终于谢了幕。\n　　又过了好几个时辰，当众人高举着通明火把，犹如一条火蛇，窜入帝王行宫时，等着他们的，却是空荡荡的巫山殿，是了无一人的死生之巅，是红莲水榭旁，伏倒在一地骨灰余烬中哭到麻木的薛蒙。\n　　还有，通天塔前，那个连尸体都已经冷透了的墨微雨。", "sceneName": "临死前", "ts": 1779770931564, "type": "scene"}, {"id": "_3e3loy4", "keywords": "年少时糟糕的审美（举例：年轻时发的说说）", "notes": "", "sentence": "千娇百媚雌雄莫辨的小美人，但是现如今，三十二岁高龄的踏仙君，怎么看怎么怀疑自己当时脑子是叫驴尥了，才会觉得这种男人好看。\n\n这人做的是皮肉生意，没了这张脸，就什么都没了。\n这媚俗的男人，就会跟狗一样流落街头，在地上爬，被靴子踹，被碾被骂被唾弃，哎呦……真是想象就让他身心愉悦。简直连刚刚这个人的恶心，都就此烟消云散了", "tagId": "_z9z89ck", "ts": 1779771121272, "typ function sanitizeDB(d){
  if(!d) d = {};
  if(!d.books) d.books = [];
  // 修复：确保每本书都有 chapters 数组
  d.books = d.books.map(b=>({...b, chapters: b.chapters||[]}));
  if(!d.entries) d.entries = {};
  if(!d.tags) d.tags = [...DEFAULT_TAGS];
  return d;
}

cloudRef.once('value').then(snapshot => {
  const data = snapshot.val();
  db = sanitizeDB(data || SEED_DATA);
  document.getElementById('loading-mask').classList.add('hidden');
  renderBooks();
}).catch(e => {
  console.error('云端加载失败，使用本地备份:', e);
  try{
    const local = localStorage.getItem('cbj3');
    db = sanitizeDB(local ? JSON.parse(local) : SEED_DATA);
  }catch{ db = sanitizeDB(SEED_DATA); }
  document.getElementById('loading-mask').classList.add('hidden');
  renderBooks();
});

}
function back(){

  const cur = stack.pop();
  const prev = stack[stack.length-1];
  const el = document.getElementById(cur);
  el.style.transition='transform .24s cubic-bezier(.4,0,.2,1)';
  el.style.transform='translateX(100%)';
  setTimeout(()=>{el.style.transform='';el.style.transition='';el.classList.remove('active')},250);
  document.getElementById(prev).classList.add('active');
  if(prev==='pg-books') renderBooks();
  if(prev==='pg-chapters') renderChapters();
  if(prev==='pg-cv') renderCV();
}

function addBook(){
  const name=prompt('请输入书名：');

  db.books.push({id:uid(),name:name.trim(),chapters:[]});

}
function deleteBook(id){

let curBook=null, chManage=false, expanded=new Set(), searchQ='';
function openBook(id){
  curBook=db.books.find(b=>b.id===id);
  chManage=false;expanded.clear();searchQ='';
  document.getElementById('scene-search').value='';
  renderChapters();goTo('pg-chapters');
}
function renderChapters(){
  document.getElementById('ch-book-title').textContent=curBook.name;
  const el=document.getElementById('chapters-list');
  const q=searchQ.trim();
  if(q){
    const res=[];
    for(const ch of curBook.chapters){
      for(const e of getEntries(ch.id)){
        if(e.type==='scene'&&e.sceneName.includes(q)) res.push({e,ch});
      }
    }
    if(!res.length){el.innerHTML=`<div class="empty">没有找到包含「${esc(q)}」的场景</div>`;return}
    el.innerHTML=res.map(({e,ch})=>`
      <div class="li" onclick="openDetail('${e.id}','${ch.id}')">
        <div class="li-main">
          <div class="li-title">${esc(e.sceneName)}</div>
          <div class="li-sub">所属章节组：${esc(ch.name)}</div>
        </div>
        <span class="arrow">›</span>
      </div>`).join('');
    return;
  }
  if(!curBook.chapters.length){el.innerHTML='<div class="empty">还没有章节组<br>点击右下角 + 创建（如：1-5章）</div>';return}
  if(chManage){
    el.innerHTML=curBook.chapters.map(ch=>{
      const cnt=getEntries(ch.id).length;
      return`<div class="mgr-row">
        <input class="mgr-inp" value="${esc(ch.name)}" onchange="renameChapter('${ch.id}',this.value)">
        <span style="font-size:12px;color:#888;margin-right:8px">${cnt}条</span>
        <button class="sm-btn danger" onclick="deleteChapter('${ch.id}')">删除</button>
      </div>`;
    }).join('')+`<div style="padding:14px 16px;font-size:12px;color:#999999">点击输入框名称可直接修改</div>`;
    return;
  }
  el.innerHTML=curBook.chapters.map(ch=>{
    const entries=getEntries(ch.id);
    const scenes=entries.filter(e=>e.type==='scene');
    const exp=expanded.has(ch.id);
    let scHtml='';
    if(exp){
      scHtml=scenes.length
        ?`<div class="ch-scenes">${scenes.map(s=>`<div class="sc-prev" onclick="openDetail('${s.id}','${ch.id}')">${esc(s.sceneName)}</div>`).join('')}</div>`
        :`<div class="ch-scenes"><span style="font-size:13px;color:#999999">暂无独立场景资料</span></div>`;
    }
    return`<div style="border-bottom: 1px solid #F5F5F5;">
      <div class="li" style="border-bottom:none">
        <span onclick="toggleExp('${ch.id}')" style="font-size:18px;color:#999999;padding:4px 12px;cursor:pointer;transform:rotate(${exp?90:0}deg);display:inline-block;transition:transform .18s;flex-shrink:0">›</span>
        <div class="li-main" onclick="openChapter('${ch.id}')">
          <div class="li-title">${esc(ch.name)}</div>
          <div class="li-sub">${entries.length} 条资料 · ${scenes.length} 个独立场景</div>
        </div>
        <span class="arrow" onclick="openChapter('${ch.id}')">进入 ›</span>
      </div>${scHtml}</div>`;
  }).join('');
}
function toggleExp(id){if(expanded.has(id))expanded.delete(id);else expanded.add(id);renderChapters()}
function searchScenes(q){searchQ=q;renderChapters()}
function toggleChapterManage(){
  chManage=!chManage;
  document.getElementById('ch-mgr-btn').textContent=chManage?'完成':'管理';
  document.getElementById('ch-fab').style.display=chManage?'none':'flex';
  renderChapters();
}
function addChapter(){
  const name=prompt('请输入章节组名称（如：1-5章、大结局）：');
  if(!name?.trim())return;
  curBook.chapters.push({id:uid(),name:name.trim()});
  save();renderChapters();
}
function renameChapter(id,name){const ch=curBook.chapters.find(c=>c.id===id);if(ch&&name.trim()){ch.name=name.trim();save()}}
function deleteChapter(id){
  const ch=curBook.chapters.find(c=>c.id===id);
  if(!ch||!confirm(`确认要删除「${ch.name}」及其内部所有的摘录和场景吗？`))return;
  curBook.chapters=curBook.chapters.filter(c=>c.id!==id);

}

let curChapter=null, curTag=null;
let nf={type:'regular',tagId:null,sentence:'',keywords:'',notes:'',sceneName:'',passage:''};
function openChapter(id){
  curChapter=curBook.chapters.find(c=>c.id===id);
  curTag=SCENE_TAG.id;
  nf={type:curTag==='__scene__'?'scene':'regular',tagId:curTag==='__scene__'?db.tags[0]?.id:(curTag||db.tags[0]?.id),sentence:'',keywords:'',notes:'',sceneName:'',passage:''};
  renderCV();goTo('pg-cv');
}
function cacheInlineInput(){
  if(nf.type==='scene'){nf.sceneName=document.getElementById('ni-sname')?.value??nf.sceneName;nf.passage=document.getElementById('ni-passage')?.value??nf.passage;}
  else{nf.sentence=document.getElementById('ni-sent')?.value??nf.sentence;nf.keywords=document.getElementById('ni-kw')?.value??nf.keywords;}
  nf.notes=document.getElementById('ni-notes')?.value??nf.notes;
}
function switchInlineType(t){cacheInlineInput();nf.type=t;renderInlineForm()}
function selectInlineTagInForm(id){
  nf.tagId=id;
  document.querySelectorAll('[data-form-tid]').forEach(btn=>{btn.classList.toggle('on',btn.dataset.formTid===id)});
}
function renderInlineForm(){
  const el=document.getElementById('cv-inline-form');
  const typeHtml=`<div class="f-sec"><div class="f-lbl">资料归类类型</div><div class="type-switch">
    <button class="type-btn${nf.type=='regular'?' on':''}" onclick="switchInlineType('regular')">绝妙摘录句</button>
    <button class="type-btn${nf.type=='scene'?' on':''}" onclick="switchInlineType('scene')">独立大场景</button>
  </div></div>`;
  if(nf.type==='scene'){
    el.innerHTML=typeHtml+`
      <div class="f-sec"><div class="f-lbl">场景名称</div><input class="inp" id="ni-sname" placeholder="如：墨燃中毒、两世怨解" value="${esc(nf.sceneName)}"></div>
      <div class="f-sec"><div class="f-lbl">原文核心段落</div><textarea class="inp" id="ni-passage" rows="4" placeholder="在这里粘贴小说里的场景原文细致描写…">${esc(nf.passage)}</textarea></div>
      <div class="f-sec"><div class="f-lbl">我的分析笔记</div><textarea class="inp" id="ni-notes" rows="3" placeholder="写下这个场景的节奏、转折设计或情绪爆点感想…">${esc(nf.notes)}</textarea></div>
      <div class="f-sec" style="border:none;text-align:right;"><button class="save-btn" onclick="saveInlineRecord()">直接保存场景</button></div>`;
  } else {
    if(!nf.tagId&&db.tags.length) nf.tagId=db.tags[0].id;
    el.innerHTML=typeHtml+`
      <div class="f-sec"><div class="f-lbl">原句</div><textarea class="inp" id="ni-sent" rows="3" placeholder="请粘贴小说原文中惊艳、值得拆解的句子…">${esc(nf.sentence)}</textarea></div>
      <div class="f-sec"><div class="f-lbl">选择核心对应标签（仅用于保存分流）</div>
        <div class="tag-sel-horizontal-scroll">
          ${db.tags.map(t=>`<button class="tag-sel-btn${nf.tagId===t.id?' on':''}" data-form-tid="${t.id}" onclick="selectInlineTagInForm('${t.id}')">🏷️ ${esc(t.label)}</button>`).join('')}
        </div>
      </div>
      <div class="f-sec"><div class="f-lbl">词组串</div><input class="inp" id="ni-kw" placeholder="例如：眉目极美 面容骄奢 铠甲生寒" value="${esc(nf.keywords)}"></div>
      <div class="f-sec"><div class="f-lbl">我的笔记</div><textarea class="inp" id="ni-notes" rows="3" placeholder="拆解分析：分析它的句式结构、修辞特色或人设加成原因…">${esc(nf.notes)}</textarea></div>
      <div class="f-sec" style="border:none;text-align:right;"><button class="save-btn" onclick="saveInlineRecord()">直接保存摘录资料</button></div>`;
  }
}
function renderCV(){
  document.getElementById('cv-title').textContent=curChapter.name;
  renderInlineForm();
  const allTags=[SCENE_TAG,...db.tags];
  const entries=getEntries(curChapter.id);
  document.getElementById('cv-tags').innerHTML=allTags.map(t=>{
    const cnt=t.id==='__scene__'?entries.filter(e=>e.type==='scene').length:entries.filter(e=>e.type==='regular'&&e.tagId===t.id).length;
    const on=curTag===t.id;
    return`<button class="tag-pill${on?' on':''}" onclick="selTag('${t.id}')"><span>${esc(t.label)}</span><span style="font-size:12px;opacity:0.6">${cnt?cnt+' 条':'-'}</span></button>`;
  }).join('');
  const el=document.getElementById('cv-entries');
  if(curTag==='__scene__'){
    const sc=entries.filter(e=>e.type==='scene');
    el.innerHTML=sc.length?sc.map(e=>`<div class="e-card" onclick="openDetail('${e.id}','${curChapter.id}')">
        <div class="e-scene-name">🎬 场景：${esc(e.sceneName)}</div>
        <div class="e-meta">${e.notes?'📝 有分析笔记':''}${e.notes?' · ':''}${fmtDate(e.ts)}</div>
      </div>`).join(''):'<div class="empty">当前章节组暂无场景资料<br>请在上方录入您的首个大场景</div>';
  } else {
    const te=entries.filter(e=>e.type==='regular'&&e.tagId===curTag);
    el.innerHTML=te.length?te.map(e=>`<div class="e-card" onclick="openDetail('${e.id}','${curChapter.id}')">
        <div class="e-keywords" style="font-weight:500;color:#111;">${esc(e.sentence.slice(0,60))}${e.sentence.length>60?'…':''}</div>
        ${e.keywords?`<div style="font-size:13px;color:#0066CC;margin-top:6px">核心词：${esc(e.keywords)}</div>`:''}
        <div class="e-meta">${e.notes?'📝 有分析笔记 · ':''}${fmtDate(e.ts)}</div>
      </div>`).join(''):'<div class="empty">当前标签下暂无摘录句子<br>请在上方快捷收集您的精彩原句</div>';
  }
}
function selTag(id){cacheInlineInput();curTag=id;renderCV()}
function saveInlineRecord(){
  if(!db.entries[curChapter.id]) db.entries[curChapter.id]=[];
  if(nf.type==='scene'){
    const sn=document.getElementById('ni-sname')?.value.trim();
    const pa=document.getElementById('ni-passage')?.value.trim();
    const no=document.getElementById('ni-notes')?.value.trim();
    if(!sn||!pa){alert('场景名和原文段落不能为空');return}
    db.entries[curChapter.id].push({id:uid(),type:'scene',sceneName:sn,passage:pa,notes:no,ts:Date.now()});
  } else {
    const se=document.getElementById('ni-sent')?.value.trim();
    const kw=document.getElementById('ni-kw')?.value.trim();
    const no=document.getElementById('ni-notes')?.value.trim();
    if(!se){alert('原文惊艳句子不能为空');return}
    db.entries[curChapter.id].push({id:uid(),type:'regular',tagId:nf.tagId,sentence:se,keywords:kw,notes:no,ts:Date.now()});
  }
  save();
  nf.sentence='';nf.keywords='';nf.notes='';nf.sceneName='';nf.passage='';
  renderCV();
}

      <div class="f-sec"><div class="f-lbl">原句</div><textarea class="inp" id="di-sent" rows="6">${esc(e.sentence)}</textarea></div>
      <div class="f-sec"><div class="f-lbl">词组串</div><input class="inp" id="di-kw" value="${esc(e.keywords||'')}"></div>
      <div class="f-sec"><div class="f-lbl">我的笔记</div><textarea class="inp" id="di-notes" rows="5">${esc(e.notes||'')}</textarea></div>
      <div class="f-sec" style="border:none"><button class="del-btn" onclick="delEntry()">删除这条摘录</button></div>`
    :`<div class="d-sec"><div class="d-lbl">原文绝妙句子</div><div class="d-text">${esc(e.sentence)}</div></div>
      ${e.keywords?`<div class="d-sec"><div class="d-lbl">提取词组串</div><div class="kw-chips">${e.keywords.split(/\s+/).filter(Boolean).map(k=>`<span class="kw-chip">${esc(k)}</span>`).join('')}</div></div>`:''}
      ${e.notes?`<div class="d-sec"><div class="d-lbl">我的分析笔记</div><div class="d-notes">${esc(e.notes)}</div></div>`:''}
      <div class="d-sec" style="border:none"><div class="d-time">录入时间：${fmtDate(e.ts)}</div></div>`;
  }

function toggleEdit(){
  if(editing){
    const e=curEntry;
    if(e.type==='scene'){
      const sn=document.getElementById('di-sname')?.value.trim();
      const pa=document.getElementById('di-passage')?.value.trim();
      const no=document.getElementById('di-notes')?.value.trim();
      if(!sn||!pa){alert('场景名称和原文段落不能为空');return}
      e.sceneName=sn;e.passage=pa;e.notes=no;
    } else {
      const se=document.getElementById('di-sent')?.value.trim();
      const kw=document.getElementById('di-kw')?.value.trim();
      const no=document.getElementById('di-notes')?.value.trim();
      if(!se){alert('原句不能为空');return}
      e.sentence=se;e.keywords=kw;e.notes=no;

  } else {editing=true}
  renderDetail();

function delEntry(){
  if(!confirm('确定要删除这条极其宝贵的写作资料吗？'))return;
  db.entries[detChId]=(db.entries[detChId]||[]).filter(e=>e.id!==curEntry.id);
  save();back();
}

function delTag(id){

function exportChapter(){
  const entries=getEntries(curChapter.id);
  if(!entries.length){alert('当前章节组内空空如也，无需导出');return}
  const lines=[`拆书库数据导出 —《${curBook.name}》· ${curChapter.name}`,'='.repeat(50)];
  const scenes=entries.filter(e=>e.type==='scene');
  if(scenes.length){lines.push('\n【🎬 场景描写拆解】');scenes.forEach((e,i)=>{lines.push(`\n[场景 ${i+1}] ${e.sceneName}`);lines.push(`- 原文核心描摹：\n  ${e.passage.replace(/\n/g,'\n  ')}`);if(e.notes)lines.push(`- 个人深度笔记：\n  ${e.notes}`);})}
  for(const tag of db.tags){const te=entries.filter(e=>e.type==='regular'&&e.tagId===tag.id);if(!te.length)continue;lines.push(`\n【🏷️ 分类：${tag.label}】`);te.forEach((e,i)=>{lines.push(`\n(${i+1}) 原文精彩句子：${e.sentence}`);if(e.keywords)lines.push(`    核心词组：${e.keywords}`);if(e.notes)lines.push(`    个人笔记：${e.notes}`);});}
  const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`【拆书笔记】${curBook.name}_${curChapter.name}.txt`;a.click();
}
function exportTxt(){
  if(!db.books.length){alert('资料库中还没有任何书籍，请先添加');return}
  const lines=[`全库小说写作场景资料库深度导出档案`,'='.repeat(60),''];
  for(const book of db.books){lines.push(`\n\n\n# 📘 《${book.name}》`);lines.push('='.repeat(40));for(const ch of book.chapters){const entries=getEntries(ch.id);if(!entries.length)continue;lines.push(`\n\n## 📌 章节组：${ch.name}`);lines.push('-'.repeat(30));const scenes=entries.filter(e=>e.type==='scene');if(scenes.length){lines.push('\n  ▸ 🎬 场景描写细分：');scenes.forEach((e,i)=>{lines.push(`    ${i+1}. 场景名称：${e.sceneName}`);lines.push(`       原文选段：${e.passage.replace(/\n/g,'\n       ')}`);if(e.notes)lines.push(`       分析笔记：${e.notes}`);});}for(const tag of db.tags){const te=entries.filter(e=>e.type==='regular'&&e.tagId===tag.id);if(!te.length)continue;lines.push(`\n  ▸ 🏷️ 核心标签：${tag.label}`);te.forEach((e,i)=>{lines.push(`    ${i+1}. 精选句子：${e.sentence}`);if(e.keywords)lines.push(`       提取词组：${e.keywords}`);if(e.notes)lines.push(`       拆解笔记：${e.notes}`);});}}}
  const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='全库小说拆书笔记归档.txt';a.click();
}


// ── 本地备份：下载 JSON 文件 ──
function backupLocal(){
  const blob = new Blob([JSON.stringify(db, null, 2)], {type:'application/json;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const d = new Date();
  a.download = `拆书笔记备份_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

// ── 从本地导入 JSON 文件 ──
function importLocal(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.onchange = e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try{
        const imported = JSON.parse(ev.target.result);
        if(!imported.books || !imported.entries){
          alert('文件格式不对，请选择本工具导出的备份 JSON 文件');
          return;
        }
        if(!confirm(`确认导入？这会覆盖当前所有数据（共 ${imported.books.length} 本书）。建议先备份当前数据。`)) return;
        db = sanitizeDB(imported);
        // 同步存到本地和云端
        localStorage.setItem('cbj3', JSON.stringify(db));
        save();
        renderBooks();
        alert('导入成功！');
      }catch(err){
        alert('读取文件失败：' + err.message);
      }
    };
    reader.readAsText(file, 'utf-8');
  };
  input.click();
}

// 初始化
const _goTo=goTo;
window.goTo=function(id){_goTo(id);if(id==='pg-tags')renderTags()};
</script>
