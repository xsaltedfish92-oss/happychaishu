<!DOCTYPE html>
<html lang=”zh-CN”>
<head>
<meta charset=”UTF-8”>
<meta name=”viewport” content=”width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no”>
<title>拆书笔记-小说场景资料库(云同步版)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
Html,body{
Height:100%;
Overflow:hidden;
Background:#FFFFFF;
}
Body{
Color:#333333;
Font-family:’PingFang SC’,’Helvetica Neue’,Arial,sans-serif;
Font-size:15px
}

/* 页面框架：全白 */
.page{position:fixed;inset:0;display:flex;flex-direction:column;background:#FFFFFF;transform:translateX(100%);transition:transform .27s cubic-bezier(.4,0,.2,1);overflow:hidden}
.page.active{transform:translateX(0)}
.page.slide-back{transform:translateX(100%)}

/* 导航栏：清爽干净 */
.hdr{display:flex;align-items:center;padding:14px 16px;padding-top:max(14px,calc(14px + env(safe-area-inset-top)));border-bottom:1px solid #EFEFEF;gap:10px;background:#FFFFFF;flex-shrink:0;min-height:56px}
.hdr-title{font-size:17px;font-weight:700;letter-spacing:1px;color:#111111;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr-sub{font-size:12px;color:#888888;margin-top:2px}
.back-btn{background:none;border:none;color:#555555;cursor:pointer;font-size:24px;padding:2px 8px 2px 0;line-height:1;font-family:inherit;flex-shrink:0}
.txt-btn{background:none;border:none;color:#0066CC;cursor:pointer;padding:6px 8px;font-size:14px;font-family:inherit;border-radius:4px;flex-shrink:0;white-space:nowrap}
.txt-btn:active{background:#F5F5F5}
.sync-indicator{font-size:11px;color:#00cc66;padding:2px 6px;background:#E6F9EE;border-radius:4px;margin-left:6px;font-weight:normal;display:none}

/* 内容区 */
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:max(80px,calc(80px + env(safe-area-inset-bottom)))}

/* 列表项 */
.li{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid #F5F5F5;gap:10px;cursor:pointer;background:#FFFFFF;transition:background .1s}
.li:active{background:#FAFAFA}
.li-main{flex:1;min-width:0}
.li-title{font-size:15px;color:#111111;font-weight:500}
.li-sub{font-size:12px;color:#666666;margin-top:4px}
.arrow{color:#CCCCCC;font-size:14px;flex-shrink:0}

/* 悬浮按钮 */
.fab{position:fixed;bottom:max(24px,calc(24px + env(safe-area-inset-bottom)));right:20px;width:52px;height:52px;border-radius:50%;background:#222222;color:#FFFFFF;font-size:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,0.15);transition:transform .15s;z-index:10;line-height:1}
.fab:active{transform:scale(.92)}

/* 横排紧凑水平滚动分类 */
.tag-horizontal-box {
  Display: flex;
  Flex-direction: row;
  Padding: 10px 16px;
  Gap: 8px;
  Background: #FFFFFF;
  Border-bottom: 1px solid #EFEFEF;
  Overflow-x: auto;
  White-space: nowrap;
  Flex-shrink: 0;
}
.tag-horizontal-box::-webkit-scrollbar { display: none; }

.tag-pill{
  Display: inline-flex;
  Align-items: center;
  Gap: 6px;
  Padding: 8px 14px;
  Border-radius: 20px;
  Border: 1px solid #EFEFEF;
  Font-family: inherit;
  Font-size: 13px;
  White-space: nowrap;
  Cursor: pointer;
  Transition: all .12s;
  Background: #FAFAFA;
  Color: #333333;
}
.tag-pill.on{
  Background:#E6F0FA !important;
  Color:#0066CC !important;
  Border-color:#B3D1F5 !important;
  Font-weight:700;
}

/* 摘录卡片 */
.e-card{padding:14px 16px;border-bottom:1px solid #EFEFEF;background:#FFFFFF;cursor:pointer;transition:background .1s}
.e-card:active{background:#FAFAFA}
.e-keywords{font-size:14px;color:#444444;line-height:1.6}
.e-scene-name{font-size:15px;color:#111111;font-weight:500}
.e-meta{font-size:12px;color:#999999;margin-top:6px}

/* 详情展示 */
.d-sec{padding:16px 16px;border-bottom:1px solid #EFEFEF;background:#FFFFFF}
.d-lbl{font-size:11px;color:#999999;letter-spacing:1px;margin-bottom:8px;font-weight:700}
.d-text{font-size:15px;color:#111111;line-height:1.7;white-space:pre-wrap}
.kw-chips{display:flex;flex-wrap:wrap;gap:6px}
.kw-chip{font-size:13px;color:#555555;background:#F0F0F0;padding:4px 10px;border-radius:4px}
.d-notes{font-size:14px;color:#666666;line-height:1.6;background:#F9F9F9;padding:10px;border-radius:4px}
.d-time{font-size:11px;color:#BBBBBB}

/* 表单输入 */
.f-sec{padding:12px 16px;border-bottom:1px solid #F5F5F5;background:#FFFFFF}
.f-lbl{font-size:12px;color:#666666;margin-bottom:6px;font-weight:700}
.inp{width:100%;max-width:500px;background:#FFFFFF;border:1px solid #CCCCCC;border-radius:6px;color:#333333;padding:8px 12px;font-size:14px;font-family:inherit;line-height:1.6;resize:vertical}
.inp:focus{outline:none;border-color:#0066CC}
.inp-single{resize:none}

/* 内置表单专用的标签横向滚动选择器 */
.tag-sel-horizontal-scroll {
  Display: flex;
  Gap: 6px;
  Overflow-x: auto;
  White-space: nowrap;
  Padding: 2px 0;
}
.tag-sel-horizontal-scroll::-webkit-scrollbar { display: none; }
.tag-sel-btn{
  Display: inline-block;
  Padding: 6px 12px;
  Border-radius: 16px;
  Border: 1px solid #EFEFEF;
  Font-family: inherit;
  Font-size: 13px;
  Cursor: pointer;
  Background: #FAFAFA;
  Color: #333333;
  Transition: all .1s;
}
.tag-sel-btn.on{background:#E6F0FA;color:#0066CC;border-color:#0066CC;font-weight:700}

/* 搜索框 */
.search-wrap{padding:10px 16px;border-bottom:1px solid #EFEFEF;background:#FFFFFF;flex-shrink:0}
.search-inp{width:100%;max-width:500px;background:#F5F5F5;border:1px solid transparent;border-radius:6px;color:#333333;padding:8px 12px;font-size:14px;font-family:inherit}
.search-inp:focus{outline:none;border-color:#CCCCCC;background:#FFFFFF}

/* 展开的场景子列表 */
.ch-scenes{background:#FAFAFA;padding:4px 16px 8px 36px;border-bottom:1px solid #EFEFEF}
.sc-prev{font-size:14px;color:#333333;padding:10px 12px;background:#FFFFFF;border:1px solid #EFEFEF;border-radius:6px;cursor:pointer;margin-top:6px}
.sc-prev:active{background:#F5F5F5}

.empty{text-align:center;padding:40px 20px;color:#999999;font-size:14px;line-height:2}

/* 按钮样式 */
.save-btn{background:#222222;border:none;color:#FFFFFF;padding:10px 24px;border-radius:6px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:background .15s}
.save-btn:active{background:#444444}
.del-btn{background:none;border:1px solid #FF3B30;color:#FF3B30;padding:10px;border-radius:6px;font-family:inherit;font-size:13px;cursor:pointer;width:100%;max-width:500px;transition:background .1s}
.del-btn:active{background:#FFEBEB}

/* 管理行 */
.mgr-row{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid #EFEFEF;background:#FFFFFF}
.mgr-inp{flex:1;max-width:300px;background:#FFFFFF;border:1px solid #CCCCCC;border-radius:4px;color:#333333;padding:6px 10px;font-size:14px;font-family:inherit}
.sm-btn{background:#FFFFFF;border:1px solid #CCCCCC;color:#555555;padding:6px 12px;border-radius:4px;font-family:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.sm-btn:active{background:#F5F5F5}
.sm-btn.danger{color:#FF3B30;border-color:#FF3B30}

.type-switch{display:flex;gap:8px;max-width:500px}
.type-btn{flex:1;padding:10px;border-radius:6px;border:1px solid #CCCCCC;font-family:inherit;font-size:13px;cursor:pointer;transition:all .12s;background:#FFFFFF;color:#555555;text-align:center}
.type-btn.on{background:#222222;border-color:#222222;color:#FFFFFF;font-weight:700}

::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:#CCCCCC;border-radius:2px}
</style>
</head>
<body>

<div id=”pg-books” class=”page active”>
  <div class=”hdr”>
<div style=”flex:1”>
      <div style=”display:flex;align-items:center;”>
        <div class=”hdr-title”>拆书笔记</div>
        <span id=”sync-status” class=”sync-indicator”>云端已同步</span>
      </div>
      <div class=”hdr-sub” id=”books-sub”>正在同步云端数据…</div>
</div>
<button class=”txt-btn” id=”books-mgr-btn” onclick=”toggleBookManage()”>管理</button>
<button class=”txt-btn” onclick=”triggerImport()”>导入旧数据</button>
<button class=”txt-btn” onclick=”exportTxt()”>导出全部</button>
<button class=”txt-btn” onclick=”goTo(‘pg-tags’)”>标签设置</button>
  </div>
  <div class=”content” id=”books-list”></div>
  <div class=”fab” id=”books-fab” onclick=”addBook()”>+</div>
</div>

<input type=”file” id=”hidden-file-input” style=”display:none” onchange=”handleFileImport(this)”>

<div id=”pg-chapters” class=”page”>
  <div class=”hdr”>
<button class=”back-btn” onclick=”back()”>‹</button>
<div class=”hdr-title” id=”ch-book-title”></div>
<button class=”txt-btn” id=”ch-mgr-btn” onclick=”toggleChapterManage()”>管理</button>
  </div>
  <div class=”search-wrap”>
<input class=”search-inp” id=”scene-search” placeholder=”搜索场景名（跨所有章节）…” oninput=”searchScenes(this.value)”>
  </div>
  <div class=”content” id=”chapters-list”></div>
  <div class=”fab” id=”ch-fab” onclick=”addChapter()”>+</div>
</div>

<div id=”pg-cv” class=”page”>
  <div class=”hdr”>
<button class=”back-btn” onclick=”back()”>‹</button>
<div class=”hdr-title” id=”cv-title”></div>
<button class=”txt-btn” onclick=”exportChapter()”>导出单章</button>
  </div>
  
  <div class=”content” style=”padding-bottom:100px;”>
<div id=”cv-inline-form” style=”background:#FFFFFF; border-bottom:4px solid #F5F5F5;”></div>
<div class=”tag-horizontal-box” id=”cv-tags”></div>
<div id=”cv-entries”></div>
  </div>
</div>

<div id=”pg-detail” class=”page”>
  <div class=”hdr”>
<button class=”back-btn” onclick=”back()”>‹</button>
<div class=”hdr-title” id=”det-title”></div>
<button class=”txt-btn” id=”det-edit-btn” onclick=”toggleEdit()”>编辑</button>
  </div>
  <div class=”content” id=”det-content”></div>
</div>

<div id=”pg-tags” class=”page”>
  <div class=”hdr”>
<button class=”back-btn” onclick=”back()”>‹</button>
<div class=”hdr-title”>标签管理</div>
  </div>
  <div class=”content” id=”tags-content”></div>
</div>

<script>
// ─────────────────────────────────────────────────────────
// CLOUD STORAGE CONFIG (路线B核心加密云通道)
// ─────────────────────────────────────────────────────────
Const BIN_ID = ‘happychaishu_db_2026’;
Const API_URL = `https://api.jsonbin.it/v1/bins/${BIN_ID}`;

Function showSyncStatus(text, isError=false) {
  Const el = document.getElementById(‘sync-status’);
  If(!el) return;
  El.textContent = text;
  El.style.display = ‘inline-block’;
  El.style.background = isError ? ‘#FFEBEB’ : ‘#E6F9EE’;
  El.style.color = isError ? ‘#FF3B30’ : ‘#00cc66’;
  If(!isError) { setTimeout(() => { el.style.display = ‘none’; }, 2000); }
}

// 从网络云端拉取最新数据
Async function pullFromCloud() {
  Try {
Const res = await fetch(API_URL);
If (res.ok) {
      Const cloudData = await res.json();
      If (cloudData && cloudData.books) {
        Db = cloudData;
        localStorage.setItem(‘cbj3’, JSON.stringify(db));
        showSyncStatus(‘云端已同步’);
      }
}
  } catch € {
Console.error(‘云端拉取失败，启用本地缓存:’, e);
showSyncStatus(‘离线模式’, true);
  }
  renderBooks();
}

// 推送最新数据到网络云端
Async function pushToCloud() {
  showSyncStatus(‘正在同步…’);
  try {
await fetch(API_URL, {
      method: ‘PUT’,
      headers: { ‘Content-Type’: ‘application/json’ },
      body: JSON.stringify(db)
});
showSyncStatus(‘同步成功’);
  } catch € {
Console.error(‘云端同步失败:’, e);
showSyncStatus(‘同步失败(已存本地)’, true);
  }
}

// ─────────────────────────────────────────────────────────
// DATA MODEL
// ─────────────────────────────────────────────────────────
Const DEFAULT_TAGS = [
  {id:’tg_wm’,label:’外貌’}, {id:’tg_hj’,label:’环境’}, {id:’tg_dz’,label:’动作’},
  {id:’tg_xd’,label:’xx道’}, {id:’tg_mr’,label:’骂人’}, {id:’tg_pj’,label:’评价他人’},
  {id:’tg_xz’,label:’修真设定’}, {id:’tg_cs’,label:’常识’}, {id:’tg_wj’,label:’物件’},
  {id:’tg_sy’,label:’熟语成语’}, {id:’tg_zz’,label:’小说转折句’},
];
Const SCENE_TAG = {id:’__scene__’,label:’场景’};

Function loadDB(){try{return JSON.parse(localStorage.getItem(‘cbj3’))||newDB()}catch{return newDB()}}
Function newDB(){return{books:[],tags:[…DEFAULT_TAGS],entries:{}}}
Function save(){
  localStorage.setItem(‘cbj3’,JSON.stringify(db));
  pushToCloud(); // 每次数据改变，自动在后台静默同步到云端
}
Function uid(){return ‘_’+Math.random().toString(36).slice(2,9)}
Function esc(s){return(s||’’).replace(/&/g,’&amp;’).replace(/</g,’&lt;’).replace(/>/g,’&gt;’).replace(/”/g,’&quot;’).replace(/’/g,’&#39;’)}
Function fmtDate(ts){const d=new Date(ts);return`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,’0’)}:${String(d.getMinutes()).padStart(2,’0’)}`}
Function getEntries(chId){return db.entries[chId]||[]}

Let db = loadDB();

// ─────────────────────────────────────────────────────────
// NAVIGATION
// ─────────────────────────────────────────────────────────
Let stack = [‘pg-books’];
Function goTo(id){
  Const cur = stack[stack.length-1];
  Document.getElementById(cur).classList.remove(‘active’);
  Document.getElementById(id).classList.add(‘active’);
  Stack.push(id);
}
Function back(){
  If(stack.length<=1) return;
  Const cur = stack.pop();
  Const prev = stack[stack.length-1];
  Const el = document.getElementById(cur);
  El.style.transition=’transform .24s cubic-bezier(.4,0,.2,1)’;
  El.style.transform=’translateX(100%)’;
  setTimeout(()=>{el.style.transform=’’;el.style.transition=’’;el.classList.remove(‘active’)},250);
  document.getElementById(prev).classList.add(‘active’);
  if(prev===’pg-books’) renderBooks();
  if(prev===’pg-chapters’) renderChapters();
  if(prev===’pg-cv’) renderCV();
}

// ─────────────────────────────────────────────────────────
// PAGE: 书籍列表
// ─────────────────────────────────────────────────────────
Let bookManage = false;
Function renderBooks(){
  Document.getElementById(‘books-sub’).textContent=`${db.books.length} 本书`;
  Const el=document.getElementById(‘books-list’);
  If(!db.books.length){el.innerHTML=’<div class=”empty”>还没有书籍<br>点击右下角 + 添加第一本</div>’;return}
  If(bookManage){
    El.innerHTML=db.books.map(b=>{
      Const cnt=b.chapters.reduce((a,c)=>a+getEntries(c.id).length,0);
      Return`<div class=”mgr-row”>
        <div style=”font-size:14px;color:#333;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap”>《${esc(b.name)}》</div>
        <span style=”font-size:12px;color:#888;flex-shrink:0;margin-right:10px”>${cnt}条摘录</span>
        <button class=”sm-btn danger” onclick=”deleteBook(‘${b.id}’)”>删除</button>
      </div>`;
}).join(‘’);
Return;
  }
  El.innerHTML=db.books.map(b=>{
Const chCnt=b.chapters.length;
Const eCnt=b.chapters.reduce((a,c)=>a+getEntries(c.id).length,0);
Return`<div class=”li” onclick=”openBook(‘${b.id}’)”>
      <div class=”li-main”>
        <div class=”li-title”>《${esc(b.name)}》</div>
        <div class=”li-sub”>${chCnt} 个章节组 · ${eCnt} 条摘录资料</div>
      </div>
      <span class=”arrow”>›</span>
</div>`;
  }).join(‘’);
}
Function toggleBookManage(){
  bookManage=!bookManage;
  document.getElementById(‘books-mgr-btn’).textContent=bookManage?’完成’:’管理’;
  document.getElementById(‘books-fab’).style.display=bookManage?’none’:’flex’;
  renderBooks();
}
Function addBook(){
  Const name=prompt(‘请输入书名：’);
  If(!name?.trim())return;
  Db.books.push({id:uid(),name:name.trim(),chapters:[]});
  Save();renderBooks();
}
Function deleteBook(id){
  Const b=db.books.find(x=>x.id===id);
  If(!b||!confirm(`确认要删除《${b.name}》吗？`))return;
  b.chapters.forEach(c=>delete db.entries[c.id]);
  db.books=db.books.filter(x=>x.id!==id);
  save();renderBooks();
}

// ─────────────────────────────────────────────────────────
// PAGE: 章节列表
// ─────────────────────────────────────────────────────────
Let curBook=null, chManage=false, expanded=new Set(), searchQ=’’;
Function openBook(id){
  curBook=db.books.find(b=>b.id===id);
  chManage=false; expanded.clear(); searchQ=’’;
  document.getElementById(‘scene-search’).value=’’;
  renderChapters(); goTo(‘pg-chapters’);
}
Function renderChapters(){
  Document.getElementById(‘ch-book-title’).textContent=curBook.name;
  Const el=document.getElementById(‘chapters-list’);
  Const q=searchQ.trim();
  If(q){
Const res=[];
For(const ch of curBook.chapters){
      For(const e of getEntries(ch.id)){
        If(e.type===’scene’&&e.sceneName.includes(q)) res.push({e,ch});
      }
}
    If(!res.length){el.innerHTML=`<div class=”empty”>没有找到包含「${esc(q)}」的场景</div>`;return}
    El.innerHTML=res.map(({e,ch})=>`
      <div class=”li” onclick=”openDetail(‘${e.id}’,’${ch.id}’)”>
        <div class=”li-main”>
          <div class=”li-title”>${esc(e.sceneName)}</div>
          <div class=”li-sub”>所属章节组：${esc(ch.name)}</div>
        </div>
        <span class=”arrow”>›</span>
      </div>`).join(‘’);
Return;
  }
  If(!curBook.chapters.length){el.innerHTML=’<div class=”empty”>还没有章节组</div>’;return}
  If(chManage){
    El.innerHTML=curBook.chapters.map(ch=>{
      Const cnt=getEntries(ch.id).length;
      Return`<div class=”mgr-row”>
        <input class=”mgr-inp” value=”${esc(ch.name)}” onchange=”renameChapter(‘${ch.id}’,this.value)”>
        <span style=”font-size:12px;color:#888;margin-right:8px”>${cnt}条</span>
        <button class=”sm-btn danger” onclick=”deleteChapter(‘${ch.id}’)”>删除</button>
      </div>`;
}).join(‘’);
Return;
  }
  El.innerHTML=curBook.chapters.map(ch=>{
Const entries=getEntries(ch.id);
Const scenes=entries.filter(e=>e.type===’scene’);
Const exp=expanded.has(ch.id);
Let scHtml=’’;
If(exp){
      scHtml=scenes.length
        ?`<div class=”ch-scenes”>${scenes.map(s=>`<div class=”sc-prev” onclick=”openDetail(‘${s.id}’,’${ch.id}’)”>${esc(s.sceneName)}</div>`).join(‘’)}</div>`
        :`<div class=”ch-scenes”><span style=”font-size:13px;color:#999999”>暂无独立场景资料</span></div>`;
}
Return`<div style=”border-bottom: 1px solid #F5F5F5;”>
      <div class=”li” style=”border-bottom:none”>
        <span onclick=”toggleExp(‘${ch.id}’)” style=”font-size:18px;color:#999999;padding:4px 12px;cursor:pointer;transform:rotate(${exp?90:0}deg);display:inline-block;transition:transform .18s;flex-shrink:0”>›</span>
        <div class=”li-main” onclick=”openChapter(‘${ch.id}’)”>
          <div class=”li-title”>${esc(ch.name)}</div>
          <div class=”li-sub”>${entries.length} 条资料 · ${scenes.length} 个独立场景</div>
        </div>
        <span class=”arrow” onclick=”openChapter(‘${ch.id}’)”>进入 ›</span>
      </div>${scHtml}</div>`;
  }).join(‘’);
}
Function toggleExp(id){ if(expanded.has(id)) expanded.delete(id); else expanded.add(id); renderChapters(); }
Function searchScenes(q){searchQ=q;renderChapters()}
Function toggleChapterManage(){
  chManage=!chManage;
  document.getElementById(‘ch-mgr-btn’).textContent=chManage?’完成’:’管理’;
  document.getElementById(‘ch-fab’).style.display=chManage?’none’:’flex’;
  renderChapters();
}
Function addChapter(){
  Const name=prompt(‘请输入章节组名称：’);
  If(!name?.trim())return;
  curBook.chapters.push({id:uid(),name:name.trim()});
  save();renderChapters();
}
Function renameChapter(id,name){ const ch=curBook.chapters.find(c=>c.id===id); if(ch&&name.trim()){ch.name=name.trim();save()} }
Function deleteChapter(id){
  Const ch=curBook.chapters.find(c=>c.id===id);
  If(!ch||!confirm(`确认要删除「${ch.name}」吗？`))return;
  curBook.chapters=curBook.chapters.filter(c=>c.id!==id);
  delete db.entries[id]; save();renderChapters();

Let curChapter=null, curTag=null;

Function renderCV(){
  Document.getElementById(‘cv-title’).textContent=curChapter.name;
  renderInlineForm();
  const allTags=[SCENE_TAG,…db.tags]; const entries=getEntries(curChapter.id);
  document.getElementById(‘cv-tags’).innerHTML=allTags.map(t=>{
const cnt=t.id===’__scene__’?entries.filter(e=>e.type===’scene’).length:entries.filter(e=>e.type===’regular’&&e.tagId===t.id).length;
return`<button class=”tag-pill${curTag===t.id?’ on’:’’}” onclick=”selTag(‘${t.id}’)”>
      <span>${esc(t.label)}</span><span style=”font-size:12px;opacity:0.6”>${cnt?cnt+’ 条’:’-‘}</span>
</button>`;
  }).join(‘’);
  Const el=document.getElementById(‘cv-entries’);
  If(curTag===’__scene__’){

    El.innerHTML=sc.length?sc.map(e=>`<div class=”e-card” onclick=”openDetail(‘${e.id}’,’${curChapter.id}’)”><div class=”e-scene-name”>🎬 场景：${esc(e.sceneName)}</div><div class=”e-meta”>${e.notes?’📝 有笔记’:’’} · ${fmtDate(e.ts)}</div></div>`).join(‘’):’<div class=”empty”>暂无场景资料</div>’;
  } else {
Const te=entries.filter(e=>e.type===’regular’&&e.tagId===curTag);
    El.innerHTML=te.length?te.map(e=>`<div class=”e-card” onclick=”openDetail(‘${e.id}’,’${curChapter.id}’)”><div class=”e-keywords” style=”font-weight:500;color:#111;”>${esc(e.sentence.slice(0,60))}</div>${e.keywords?`<div style=”font-size:13px;color:#0066CC;margin-top:6px”>核心词：${esc(e.keywords)}</div>`:’’}<div class=”e-meta”>${e.notes?’📝 有笔记 · ‘:’’}${fmtDate(e.ts)}</div></div>`).join(‘’):’<div class=”empty”>暂无摘录句子</div>’;
  }
}
Function selTag(id){ cacheInlineInput(); curTag=id; renderCV(); }
Function saveInlineRecord(){
  If(!db.entries[curChapter.id]) db.entries[curChapter.id] = [];
  If(nf.type===’scene’){
Const sn=document.getElementById(‘ni-sname’)?.value.trim(); const pa=document.getElementById(‘ni-passage’)?.value.trim(); const no=document.getElementById(‘ni-notes’)?.value.trim();
If(!sn||!pa){alert(‘不能为空’);return}
    Db.entries[curChapter.id].push({id:uid(),type:’scene’,sceneName:sn,passage:pa,notes:no,ts:Date.now()});
  } else {
Const se=document.getElementById(‘ni-sent’)?.value.trim(); const kw=document.getElementById(‘ni-kw’)?.value.trim(); const no=document.getElementById(‘ni-notes’)?.value.trim();
If(!se){alert(‘不能为空’);return}
    Db.entries[curChapter.id].push({id:uid(),type:’regular’,tagId:nf.tagId,sentence:se,keywords:kw,notes:no,ts:Date.now()});
  }
  Save(); nf.sentence=’’; nf.keywords=’’; nf.notes=’’; nf.sceneName=’’; nf.passage=’’; renderCV();
}
